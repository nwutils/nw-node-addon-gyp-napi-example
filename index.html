<!doctype html>

<html>

<head>
    <title>NW.js Node Native Addon Demo</title>
    <script>
        const examples = {
            napi: () => require("./build/Release/hello"),
            nan: () => require("./build/Release/hello_nan"),
            cmake: () => require("./cmake/build/Release/hello_cmake"),
            ffi: () => require("./ffi/index.cjs"),
        };

        // `--example=<id>` loads a single example (used by the test suite, so
        // that one failing addon cannot take down the others). Without it,
        // all examples are loaded.
        const only = nw.App.fullArgv
            .find((arg) => arg.startsWith("--example="))
            ?.slice("--example=".length);

        window.onload = () => {
            for (const [id, load] of Object.entries(examples)) {
                if (only && only !== id) {
                    continue;
                }
                const element = document.getElementById(id);
                try {
                    element.textContent = load().hello();
                } catch (error) {
                    element.textContent = String(error);
                }
            }
        };
    </script>
</head>

<body>
    <p>If you can see "world" next to each example, then the addon was successfully built and loaded.</p>
    <ul>
        <li>Node-API (node-gyp): <span id="napi"></span></li>
        <li>NAN (node-gyp): <span id="nan"></span></li>
        <li>Node-API (cmake-js): <span id="cmake"></span></li>
        <li>FFI (CMake + koffi): <span id="ffi"></span></li>
    </ul>
</body>

</html>
